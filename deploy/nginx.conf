# /etc/nginx/sites-available/mmastart.ru
# После установки: ln -s /etc/nginx/sites-available/mmastart.ru /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name mmastart.ru www.mmastart.ru;

    # Certbot заменит этот блок на HTTPS при выдаче сертификата
    location / {
        return 301 https://mmastart.ru$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name www.mmastart.ru;

    ssl_certificate     /etc/letsencrypt/live/mmastart.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mmastart.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://mmastart.ru$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mmastart.ru;

    ssl_certificate     /etc/letsencrypt/live/mmastart.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mmastart.ru/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    # Статика — отдаём напрямую через nginx, без Django
    location /static/ {
        alias /var/www/mmastart/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Медиафайлы (PDF-билеты, фото бойцов)
    location /media/ {
        alias /var/www/mmastart/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Всё остальное — в Gunicorn
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Защита от прямого доступа к .env и git
    location ~ /\. {
        deny all;
    }
}
